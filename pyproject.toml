[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderwatch-sa"
version = "0.0.0"
description = "TenderWatch SA DEV helpers"
requires-python = ">=3.11"
# Runtime imports are the Python standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
test = ["pytest"]

[tool.setuptools]
packages = ["tw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
